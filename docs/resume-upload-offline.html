<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9fbfa">
  <title>Upload Your Resume</title>
  <style>* { box-sizing: border-box; }
:root {
  font-family: Arial, Helvetica, sans-serif;
  color: #101110;
  background: #f9fbfa;
  --blue: #205bff;
  --unit: min(1vw, 1.65svh, 14px);
}
body { margin: 0; }
[hidden] { display: none !important; }
.layout {
  width: min(91%, 165svh, 1400px); margin: 0 auto;
  display: grid; grid-template-columns: minmax(0, .88fr) minmax(0, 1fr);
  column-gap: clamp(22px, 5vw, 80px); align-items: center; align-content: center;
  padding-block: clamp(16px, 4svh, 54px);
  min-height: 100vh; min-height: 100svh;
}
.intro { display: grid; gap: clamp(20px, 5svh, 64px); min-width: 0; }
.intro-copy { padding-inline: 4%; }
h1, h2, p { margin: 0; }
h1 { font-size: clamp(26px, 2.08vw, 44px); line-height: 1.37; font-weight: 400; }
.intro p { max-width: calc(var(--unit) * 35.75); margin-top: calc(var(--unit) * 1.38); font-size: clamp(14px, 1.05vw, 22px); line-height: 1.73; color: #919894; }
.illustration {
  display: block; justify-self: center;
  width: min(86%, 540px, 51svh); height: auto;
}
.card {
  align-self: center; margin: 0;
  background: white; border-radius: calc(var(--unit) * 1.8);
  padding: calc(var(--unit) * 1.36) 13.77% calc(var(--unit) * 4.5);
  box-shadow: 0 2px 16px rgba(39, 93, 77, .13); min-width: 0;
}
h2 { margin-bottom: calc(var(--unit) * 2.38); color: #17132e; font-size: clamp(22px, 1.88vw, 40px); font-weight: 600; line-height: 1.35; letter-spacing: .07em; }
.dropzone, .message {
  position: relative; width: 100%; aspect-ratio: 684 / 420;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border: 1px dashed #6587b9; border-radius: 2.5% / 4%;
  padding: 1rem; background: #f2f9ff; text-align: center; gap: calc(var(--unit) * .72);
}
.dropzone input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.dropzone:hover, .dropzone.dragging, .dropzone:focus-within { background: #eaf3ff; border-color: var(--blue); }
.dropzone:focus-within, button:focus-visible { outline: 3px solid #284dbf; outline-offset: 4px; }
.cloud { color: #2054c8; width: clamp(36px,3.05vw,65px); height: auto; flex-shrink: 0; }
.hint, .file-name { max-width: 78%; overflow-wrap: anywhere; }
.hint { color: #858f98; font-size: clamp(12px,.84vw,18px); line-height: 1.9; }
.file-name { color: #234eaa; font-weight: 600; max-height: 3.6em; overflow: auto; line-height: 1.2; }
.actions { margin: calc(var(--unit) * 5.1) auto 0; display: flex; justify-content: center; gap: 4.9%; width: 84%; }
button { border: 0; border-radius: 7px; color: #fff; background: var(--blue); cursor: pointer; font: inherit;
  font-size: clamp(15px,1.25vw,26px); letter-spacing: .09em; flex: 1;
  min-height: max(44px,calc(var(--unit) * 3.5)); padding: .4em .55em; }
button.back { background: #79adfa; }
button:hover { filter: brightness(.93); }
button:active { transform: translateY(1px); filter: brightness(.86); }
.steps { position: relative; display: flex; justify-content: space-around; align-items: center; padding: 0; margin: calc(var(--unit) * 5.2) auto 0; width: 50%; list-style: none; }
.steps::before { content: ""; position: absolute; inset: 50% 0 auto; transform: translateY(-50%); height: 3px; background: linear-gradient(to right,#8daaff 81%,#ddd 81%); }
.steps li { z-index: 1; width: clamp(18px,1.67vw,35px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; background: #82a6ff; border: 2px solid #4469ed; color: #244bcc; font-size: clamp(10px,.76vw,16px); }
.steps li.pending { background: #edf0f4; border-color: #b9c2ce; color: #66717d; }
.steps li[aria-current] { color: white; }
.message p { overflow-wrap: anywhere; max-width: 100%; color: #43556a; line-height: 1.6; }
h2:focus { outline: none; }
.sr-only { position: absolute; width: 1px; height: 1px; clip-path: inset(50%); overflow: hidden; }
.preview-trigger { position: relative; z-index: 1; flex: none; font: 600 14px/1.4 Arial, sans-serif; letter-spacing: normal; min-height: 32px; padding: 4px 14px; background: white; border: 1px solid #b5c9ed; color: #254faa; }
.preview-dialog { width: min(860px, 94vw); max-height: 92svh; padding: 0; border: none; border-radius: 16px; color: #17132e; box-shadow: 0 12px 70px #14243f44; }
.preview-dialog::backdrop { background: #14213288; }
.preview-header { display: flex; gap: 1rem; align-items: center; justify-content: space-between; padding: 16px 20px; }
.preview-header h2 { margin: 0; font: 600 18px/1.4 Arial,sans-serif; letter-spacing: normal; overflow-wrap: anywhere; }
.preview-close { flex: none; font-size: 15px; letter-spacing: normal; min-height: 36px; padding: 6px 14px; }
.preview-body { height: min(64svh, 720px); overflow: auto; background: #f2f6fb; }
.preview-body iframe, .preview-body img { display: block; width: 100%; height: 100%; border: 0; object-fit: contain; }
.preview-body p, .preview-body pre { padding: 20px; margin: 0; }
.preview-body pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.preview-link { display: inline-block; padding: 12px 20px; color: #234eaa; }
@media (max-width: 760px) {
  .layout { display: block; width: 100%; padding: 28px 20px; }
  .intro { grid-template-columns: minmax(0, 1fr) 30%; gap: 12px; align-items: center; max-width: 540px; margin: 0 auto 24px; }
  .intro-copy { padding: 0; }
  h1 { font-size: 28px; line-height: 1.25; }
  .intro p { max-width: 32em; margin-top: 10px; color: #717a76; }
  .illustration { width: 100%; max-width: 160px; justify-self: end; }
  .card { max-width: 540px; margin: 0 auto; padding: 24px clamp(18px,5vw,35px) 28px; border-radius: 20px; }
  h2 { margin-bottom: 20px; }
  .dropzone, .message { min-height: 185px; gap: 10px; }
  .hint, .file-name { max-width: 95%; }
  .actions { width: 100%; margin-top: 24px; }
  .steps { margin-top: 30px; }
}
@media (prefers-reduced-motion: no-preference) {
  .illustration { transition: transform 220ms ease-out; }
  .layout:has(.dropzone.dragging) .illustration { transform: translateY(-4px) rotate(-1deg); }
}
</style>
  
</head>

    <section class="card" aria-labelledby="panel-title">
      <h2 id="panel-title" tabindex="-1">Upload file</h2>
      <form id="upload-form">
        <div class="dropzone" id="dropzone">
          <input type="file" id="resume" aria-label="Choose a resume file" aria-describedby="file-hint">
          <svg class="cloud" viewBox="0 0 60 44" aria-hidden="true"><path d="M15 39h31a10 10 0 0 0 0-20 17 17 0 0 0-32-5A12.6 12.6 0 0 0 15 39Z" fill="none" stroke="currentColor" stroke-width="5.2" stroke-linejoin="round"/><path d="m30 16-9 10h6v7h7v-7h6z" fill="currentColor"/></svg>
          <span class="file-name" id="file-name" hidden></span>
          <span class="hint" id="file-hint">Drag your resume file to this area, or click on the area to select the appropriate file to upload</span>
          <button type="button" id="preview" class="preview-trigger" aria-haspopup="dialog" hidden>Preview file</button>
        </div>
        <div class="actions">
          <button type="button" class="back" id="back">Last step</button>
          <button type="submit">Finish</button>
        </div>
      </form>
      <div id="alternate" hidden>
        <div class="message"><p id="message"></p></div>
        <div class="actions"><button id="return" type="button"></button></div>
      </div>
      <ol class="steps" aria-label="Application progress">
        <li aria-label="Step 1, completed">✓</li>
        <li aria-label="Step 2, completed">✓</li>
        <li aria-label="Step 3, upload resume" aria-current="step">3</li>
      </ol>
      <div role="status" id="announcement" class="sr-only"></div>
    </section>
  </main>
  <dialog id="reader" class="preview-dialog" aria-labelledby="preview-title">
    <header class="preview-header"><h2 id="preview-title">File preview</h2><button type="button" class="preview-close" id="close-preview" autofocus>Close</button></header>
    <div class="preview-body" id="preview-body"></div>
    <a class="preview-link" id="pdf-link" target="_blank" rel="noopener noreferrer" hidden>Open PDF in a new tab</a>
  </dialog>
<script>const form = document.querySelector('#upload-form');
const zone = document.querySelector('#dropzone');
const input = document.querySelector('#resume');
const filename = document.querySelector('#file-name');
const hint = document.querySelector('#file-hint');
const announcement = document.querySelector('#announcement');
const title = document.querySelector('#panel-title');
const alternate = document.querySelector('#alternate');
const returnButton = document.querySelector('#return');
const steps = [...document.querySelectorAll('.steps li')];
let selected = null;
let dragDepth = 0;
const preview = document.querySelector('#preview');
const reader = document.querySelector('#reader');
const body = document.querySelector('#preview-body');
const pdfLink = document.querySelector('#pdf-link');
let objectUrl;

function clearPreview() {
  body.replaceChildren();
  pdfLink.hidden = true;
  pdfLink.removeAttribute('href');
  if (objectUrl) URL.revokeObjectURL(objectUrl);
  objectUrl = null;
}

preview.addEventListener('click', async () => {
  const file = selected;
  if (!file) return;
  clearPreview();
  document.querySelector('#preview-title').textContent = file.name;
  reader.showModal();
  const extension = file.name.split('.').pop().toLowerCase();
  const images = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp', gif: 'image/gif' };
  const isPdf = file.type === 'application/pdf' || extension === 'pdf';
  if (isPdf || Object.hasOwn(images, extension)) {
    objectUrl = URL.createObjectURL(file.slice(0, file.size, isPdf ? 'application/pdf' : images[extension]));
    const content = document.createElement(isPdf ? 'iframe' : 'img');
    if (isPdf) {
      content.title = 'PDF preview: ' + file.name;
      pdfLink.href = objectUrl;
      pdfLink.hidden = false;
    } else {
      content.alt = file.name;
      content.onerror = () => { body.textContent = 'This image could not be displayed.'; };
    }
    content.src = objectUrl;
    body.append(content);
  } else if (extension === 'txt' || file.type === 'text/plain') {
    const text = document.createElement('pre');
    body.append(text);
    try {
      const limit = 256 * 1024;
      text.textContent = await file.slice(0, limit).text();
      if (file.size > limit) text.append('\n\n[Preview limited to the first 256 KB.]');
    } catch { text.textContent = 'This text file could not be read.'; }
  } else {
    const notice = document.createElement('p');
    notice.textContent = 'Preview is available for PDF, images and plain text. Your file is still selected.';
    body.append(notice);
  }
});
document.querySelector('#close-preview').addEventListener('click', () => reader.close());
reader.addEventListener('close', () => {
  if (!reader.open) clearPreview();
});

function selectFile(file) {
  if (!file) return;
  selected = file;
  filename.textContent = file.name;
  filename.hidden = false;
  preview.hidden = false;
  hint.textContent = 'Click or drop another file to replace it';
  announcement.textContent = 'Selected: ' + file.name;
}
input.addEventListener('change', () => selectFile(input.files[0]));
zone.addEventListener('dragenter', event => {
  event.preventDefault();
  dragDepth++;
  zone.classList.add('dragging');
});
zone.addEventListener('dragover', event => {
  event.preventDefault();
  event.dataTransfer.dropEffect = 'copy';
});
zone.addEventListener('dragleave', () => {
  if (--dragDepth <= 0) zone.classList.remove('dragging');
});
zone.addEventListener('drop', event => {
  event.preventDefault();
  dragDepth = 0;
  zone.classList.remove('dragging');
  const files = event.dataTransfer.files;
  if (files.length !== 1) {
    hint.textContent = 'Please choose one resume at a time';
    announcement.textContent = hint.textContent;
    return;
  }
  input.value = '';
  selectFile(files[0]);
});

function show(view) {
  const editing = view === 'upload';
  const previous = view === 'previous';
  title.textContent = editing ? 'Upload file' : previous ? 'Resume options' : 'Finished';
  form.hidden = !editing;
  alternate.hidden = editing;
  document.querySelector('#message').textContent = previous
    ? 'You can add a resume in the final step, or finish without one.'
    : selected ? 'Resume selected: ' + selected.name : 'Completed without a resume.';
  returnButton.textContent = previous ? 'Next step' : 'Back to upload';
  steps.forEach((item, i) => {
    const active = (editing && i === 2) || (previous && i === 1);
    const pending = previous && i === 2;
    item.textContent = active || pending ? String(i + 1) : '✓';
    item.classList.toggle('pending', pending);
    item.removeAttribute('aria-current');
    if (active) item.setAttribute('aria-current', 'step');
    item.setAttribute('aria-label', 'Step ' + (i + 1) + ', ' + (active ? 'current' : pending ? 'upcoming' : 'completed'));
  });
  title.focus();
}
form.addEventListener('submit', event => {
  event.preventDefault();
  show('finished');
});
document.querySelector('#back').addEventListener('click', () => show('previous'));
returnButton.addEventListener('click', () => show('upload'));
</script></body>
</html>
